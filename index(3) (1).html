<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Music Journey</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f6f2;color:#29342f;font:16px system-ui,sans-serif}main{max-width:650px;margin:auto;padding:20px 16px 100px}h1{color:#466657;font-size:28px}h2{font-size:21px}h3{font-size:17px}.card{background:white;padding:18px;border-radius:16px;margin:12px 0;box-shadow:0 2px 8px #0001}button{background:#466657;color:white;border:0;border-radius:9px;padding:12px;font:inherit;margin:4px 3px 4px 0;cursor:pointer}button.alt{background:#e9eee9;color:#314b3f}label{display:block;margin:12px 0 5px;font-weight:600}input,textarea,select{width:100%;padding:11px;border:1px solid #cbd2cc;border-radius:8px;font:inherit;background:white}textarea{min-height:75px}nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:center;border-top:1px solid #ddd;padding:8px 4px env(safe-area-inset-bottom,8px)}nav button{font-size:13px;padding:10px 7px}small{color:#65736a}p{white-space:pre-wrap;overflow-wrap:anywhere}.piece{border:1px solid #dce3dc;padding:12px;border-radius:10px;margin:10px 0}#msg{color:#315d46}button:focus-visible,input:focus-visible{outline:3px solid #9bc9a8}</style><main><h1>My Music Journey</h1><small>音楽を学んだ時間を、未来の財産に。</small><p id="msg" role="status"></p><div id="view"></div><p><small>試用版：このブラウザ内に保存します。仮名で試し、設定からバックアップしてください。共有・認証は未実装です。</small></p></main><nav id="nav"></nav><script>
'use strict';const K='mmj-v2',OLD='mmj-demo-lessons-v1',v=document.getElementById('view');let db={students:[],lessons:[]},page='home',sid='',editing=null;try{let raw=localStorage.getItem(K);if(raw)db=JSON.parse(raw)}catch(e){alert('保存データを読み込めません。上書きせず終了してください。');throw e}const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now()+'-'+Math.random();const today=()=>new Date().toLocaleDateString('sv-SE');function E(tag,txt,parent){let e=document.createElement(tag);if(txt!=null)e.textContent=txt;if(parent)parent.append(e);return e}function B(parent,txt,fn,alt=false){let b=E('button',txt,parent);b.type='button';if(alt)b.className='alt';b.onclick=fn;return b}function C(parent=v){let e=E('div',null,parent);e.className='card';return e}function F(parent,label,value='',type='text'){let l=E('label',label,parent),e=E(type==='textarea'?'textarea':'input',null,l);if(type!=='textarea')e.type=type;e.value=value;return e}function S(parent,label,opts,value){let l=E('label',label,parent),e=E('select',null,l);for(let o of opts){let x=E('option',o,e);x.value=o}e.value=value;return e}function save(next){try{localStorage.setItem(K,JSON.stringify(next));db=next;document.getElementById('msg').textContent='保存しました。';return true}catch{alert('保存できませんでした。');return false}}function go(p){page=p;render();scrollTo(0,0)}function student(){return db.students.find(s=>s.id===sid)}function records(){return db.lessons.filter(r=>r.sid===sid).sort((a,b)=>b.date.localeCompare(a.date))}function render(){v.replaceChildren();let n=document.getElementById('nav');n.replaceChildren();for(let [p,t] of [['home','ホーム'],['talk','トーク'],['schedule','予定'],['fees','レッスン料'],['settings','設定']])B(n,t,()=>go(p),page!==p);if(page==='home'){E('h2','生徒一覧',v);B(v,'＋ 生徒登録',()=>{sid='';go('studentForm')});for(let s of db.students){let c=C();E('h3',s.name,c);E('small',s.kind,c);B(c,'開く',()=>{sid=s.id;go('student')})}if(!db.students.length)E('p','まず仮名で生徒を登録してください。',v)}else if(page==='studentForm'){let s=student()||{},c=C();E('h2','生徒登録・編集',c);let name=F(c,'生徒名',s.name),kind=S(c,'レッスン形態',['月謝','ワンレッスン'],s.kind||'月謝'),count=F(c,'月の予定回数',s.count??2,'number'),fee=F(c,'通常料金（円）',s.fee??0,'number'),duration=F(c,'時間（分）',s.duration??60,'number');B(c,'保存',()=>{if(!name.value.trim()||[count,fee,duration].some(x=>!x.value||!Number.isFinite(+x.value)||+x.value<0)||+duration.value<1||!Number.isInteger(+count.value)){alert('入力内容を確認してください。');return}let item={id:s.id||uid(),name:name.value.trim(),kind:kind.value,count:+count.value,fee:+fee.value,duration:+duration.value};if(save({...db,students:[...db.students.filter(x=>x.id!==item.id),item]})){sid=item.id;go('student')}});B(c,'戻る',()=>go('home'),true)}else if(page==='student'){let s=student();if(!s)return go('home');E('h2',s.name,v);B(v,'＋ レッスン記録',()=>{editing=null;go('note')});B(v,'登録内容の編集',()=>go('studentForm'),true);let c=C();E('h3','レッスン履歴',c);for(let r of records()){let a=C(c);E('strong',r.date,a);for(let p of r.pieces)E('p',p.kind+'：'+p.title+'\n'+p.content,a);if(r.next)E('p','次回に向けて：'+r.next,a);B(a,'詳細・編集',()=>{editing=r;go('note')},true)}if(!records().length)E('p','まだ記録がありません。',c);let rep=C();E('h3','レパートリー',rep);let m=new Map();for(let r of records()){let seen=new Set();for(let p of r.pieces){let k=p.kind+'：'+p.title;if(p.title&&!seen.has(k)){m.set(k,(m.get(k)||0)+1);seen.add(k)}}}for(let [k,num] of m)E('p',k+'　'+num+'回',rep)}else if(page==='note'){if(!student())return go('home');let r=editing||{},c=C();E('h2',student().name+' のレッスン記録',c);let date=F(c,'レッスン日',r.date||today(),'date'),condition=F(c,'近況・コンディション',r.condition,'textarea'),voice=F(c,'発声練習（姿勢・呼吸・ハミングなど）',r.voice,'textarea');let area=E('div',null,c),cards=[];function add(p={}){let a=E('div',null,area);a.className='piece';let kind=S(a,'種類',['練習曲','課題曲・自由曲'],p.kind||'練習曲'),title=F(a,'曲名・教材番号',p.title),content=F(a,'レッスン内容',p.content,'textarea');let item={kind,title,content};cards.push(item);B(a,'この曲を外す',()=>{cards=cards.filter(x=>x!==item);a.remove()},true)}for(let p of r.pieces||[])add(p);B(c,'＋ 曲を追加',()=>add(),true);let next=F(c,'次回に向けて',r.next,'textarea'),nd=F(c,'次回のレッスン日（任意）',r.nd,'date'),nt=F(c,'時刻（任意）',r.nt,'time'),place=F(c,'場所（任意）',r.place);B(c,'記録を保存',()=>{if(!date.value){alert('日付を入力してください');return}let pieces=cards.map(x=>({kind:x.kind.value,title:x.title.value.trim(),content:x.content.value.trim()}));if(pieces.some(p=>!p.title&&p.content)){alert('曲名・教材番号を入力してください');return}let item={id:r.id||uid(),sid,date:date.value,condition:condition.value,voice:voice.value,pieces:pieces.filter(p=>p.title),next:next.value,nd:nd.value,nt:nt.value,place:place.value};if(save({...db,lessons:[...db.lessons.filter(x=>x.id!==item.id),item]}))go('student')});B(c,'戻る（保存しない）',()=>{if(confirm('保存せず戻りますか？'))go('student')},true)}else if(page==='schedule'){E('h2','次回のレッスン予定',v);for(let s of db.students){let r=db.lessons.filter(x=>x.sid===s.id).sort((a,b)=>b.date.localeCompare(a.date))[0];if(r?.nd){let c=C();E('h3',s.name,c);E('p',r.nd+' '+r.nt+' '+r.place,c);B(c,'生徒ページ',()=>{sid=s.id;go('student')})}}E('small','現在は最新の記録に入力した次回予定のみ表示します。週間カレンダーは今後追加します。',v)}else if(page==='fees'||page==='talk'){E('h2',page==='fees'?'レッスン料':'トーク',v);E('p','今後追加予定です。',C())}else if(page==='settings'){let c=C();E('h2','バックアップ',c);B(c,'バックアップを保存',()=>{let u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'})),a=E('a');a.href=u;a.download='mmj-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)});let f=F(c,'バックアップから復元（現在の記録を置換）','','file');f.accept='.json,application/json';B(c,'復元する',async()=>{try{let x=JSON.parse(await f.files[0].text());let str=(o,keys)=>keys.every(k=>typeof o[k]==='string');if(!Array.isArray(x.students)||!Array.isArray(x.lessons)||!x.students.every(s=>str(s,['id','name','kind'])&&['count','fee','duration'].every(k=>Number.isFinite(s[k])))||!x.lessons.every(r=>str(r,['id','sid','date','condition','voice','next','nd','nt','place'])&&x.students.some(s=>s.id===r.sid)&&Array.isArray(r.pieces)&&r.pieces.every(p=>str(p,['kind','title','content']))))throw Error();if(confirm('現在のデータを置き換えますか？')){if(save(x))go('home')}}catch{alert('対応するバックアップファイルを選択してください。')}});let old=C();E('h3','旧試用版の記録',old);try{let a=JSON.parse(localStorage.getItem(OLD)||'[]');E('p','旧記録：'+a.length+'件。旧データは削除していません。',old);if(a.length)B(old,'旧記録を表示',()=>{for(let r of a)E('p',[r.date,r.piece,r.lesson,r.point,r.next].join('\n'),old)})}catch{E('p','旧記録を読み込めません。',old)}}}render();</script></html>
