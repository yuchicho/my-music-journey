
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Music Journey</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f8f6f2;
      color: #333;
      margin: 0;
      padding: 24px;
    }
    .app {
      max-width: 520px;
      margin: auto;
    }
    h1 { color: #466657; }
    .card {
      background: white;
      padding: 20px;
      margin: 14px 0;
      border-radius: 14px;
      box-shadow: 0 2px 8px #00000010;
    }
    button {
      background: #466657;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>My Music Journey</h1>
    <p>音楽を学んだ時間を、未来の財産に。</p>

    <div class="card">
      <h2>レッスンノート</h2>
      <p>今日の学びと次回に向けての記録</p>
      <button>ノートを開く</button>
    </div>

    <div class="card">
      <h2>学習履歴</h2>
      <p>これまで取り組んだ曲やレッスン</p>
      <button>履歴を見る</button>
    </div>

    <div class="card">
      <h2>メッセージ</h2>
      <p>先生と生徒の自由なやり取り</p>
      <button>メッセージを開く</button>
    </div>

    <div class="card">
      <h2>レッスン予定</h2>
      <p>日時や場所を確認</p>
      <button>予定を見る</button>
    </div>
  </main>
</body>
</html>
